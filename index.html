    <style>
        :root { 
            --deep-dark: #0a0e14; 
            --card-bg: rgba(255, 255, 255, 0.03);
            --neon-blue: #00d2ff; 
            --accent-blue: #0056b3; 
            --whatsapp-green: #25d366; 
            --text-gray: #cbd5e0;
            --pure-white: #ffffff;
        }

        body { 
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; 
            margin: 0; 
            color: var(--pure-white); 
            line-height: 1.6; 
            background: radial-gradient(circle at top right, #111827, #0a0e14);
            background-attachment: fixed;
            scroll-behavior: smooth;
        }
        
        .nav-header {
            position: absolute;
            top: 25px;
            right: 30px;
            z-index: 1000;
        }

        .nav-menu {
            display: flex;
            gap: 4px;
            list-style: none;
            margin: 0;
            padding: 0;
            flex-wrap: wrap;
            justify-content: flex-end;
        }

        .nav-menu a, .btn-style {
            color: var(--pure-white);
            text-decoration: none;
            font-size: 0.66rem;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 0.4px;
            padding: 8px 9px;
            border-radius: 8px;
            border: 1px solid rgba(0, 210, 255, 0.3);
            transition: all 0.3s ease;
            background: rgba(10, 14, 20, 0.6);
            backdrop-filter: blur(8px);
        }

        .nav-menu a:hover, .btn-style:hover {
            color: var(--neon-blue);
            border-color: var(--neon-blue);
            box-shadow: 0 0 15px rgba(0, 210, 255, 0.2);
            background: rgba(0, 210, 255, 0.08);
        }

        /* AJUSTE NO HEADER PARA A REDE MESH */
        header { 
            position: relative;
            overflow: hidden;
            background: #0a0e14 url('header-powertech.png') no-repeat center top; 
            background-size: contain; 
            min-height: 212px; 
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            border-bottom: 1px solid rgba(0, 210, 255, 0.3);
        }
