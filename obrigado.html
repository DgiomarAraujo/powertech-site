<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Download Iniciado | PowerTech Industrial</title>
    <style>
        :root {
            --deep-dark: #0a0e14;
            --neon-blue: #00d2ff;
            --text-gray: #cbd5e0;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: radial-gradient(circle at top right, #111827, #0a0e14);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
        }
        .card {
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(0,210,255,0.3);
            border-radius: 20px;
            padding: 50px 40px;
            max-width: 480px;
            width: 90%;
            text-align: center;
            backdrop-filter: blur(10px);
            box-shadow: 0 0 40px rgba(0,210,255,0.1);
        }
        .icon {
            font-size: 3.5rem;
            margin-bottom: 20px;
        }
        h1 {
            color: var(--neon-blue);
            font-size: 1.6rem;
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        p {
            color: var(--text-gray);
            margin-bottom: 30px;
            line-height: 1.7;
        }
        .btn-download {
            display: inline-block;
            padding: 14px 32px;
            background: var(--neon-blue);
            color: #0a0e14;
            font-weight: bold;
            font-size: 0.95rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            border-radius: 10px;
            text-decoration: none;
            transition: 0.3s;
            margin-bottom: 20px;
        }
        .btn-download:hover {
            box-shadow: 0 0 25px rgba(0,210,255,0.5);
            transform: translateY(-2px);
        }
        .back-link {
            display: block;
            margin-top: 16px;
            color: var(--text-gray);
            font-size: 0.85rem;
            text-decoration: none;
        }
        .back-link:hover { color: var(--neon-blue); }
        .progress {
            height: 3px;
            background: rgba(0,210,255,0.15);
            border-radius: 2px;
            margin-top: 30px;
            overflow: hidden;
        }
        .progress-bar {
            height: 100%;
            background: var(--neon-blue);
            width: 0%;
            animation: fill 3s ease forwards;
        }
        @keyframes fill { to { width: 100%; } }
    </style>
</head>
<body>

<div class="card">
    <div class="icon">⚡</div>
    <h1>Download Iniciado!</h1>
    <p>
        Obrigado pelo cadastro!<br>
        Seu arquivo <strong>Projeto SPDA em AutoCAD (PDF)</strong> está sendo baixado automaticamente.<br><br>
        Se não iniciou, clique no botão abaixo:
    </p>

    <a href="https://powertechindustrial.com.br/downloads/projeto-spda-autocad.pdf"
       download="Projeto-SPDA-AutoCAD-PowerTech.pdf"
       class="btn-download">
        ⬇ Baixar PDF Agora
    </a>

    <div class="progress"><div class="progress-bar"></div></div>

    <a href="https://powertechindustrial.com.br/biblioteca.html" class="back-link">
        ← Voltar para a Biblioteca
    </a>
</div>

<script>
    // Download automático ao abrir a página
    window.addEventListener('load', function () {
        setTimeout(function () {
            const link = document.createElement('a');
            link.href = 'https://powertechindustrial.com.br/downloads/projeto-spda-autocad.pdf';
            link.download = 'Projeto-SPDA-AutoCAD-PowerTech.pdf';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }, 800);
    });
</script>

</body>
</html>
